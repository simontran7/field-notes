<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" width="900" height="600" role="img" aria-labelledby="title desc" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title id="title">Tail-recursive factorial(3), with and without tail call optimization</title>
<desc id="desc">Without tail call optimization, each call pushes a new frame, so the stack grows from 2 to 5 frames and the result takes 4 returns to reach main. With tail call optimization, each call reuses the same frame with new arguments, so the stack stays at 2 frames and the base case returns 6 directly to main.</desc>
<style>
.t{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;fill:#1f2937}
.m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#1f2937}
.mut{fill:#6b7280}
.f{fill:#eef2ff;stroke:#6366f1;stroke-width:1.5}
.main{fill:#f3f4f6;stroke:#9ca3af;stroke-width:1.5}
.act{fill:#fef3c7;stroke:#d97706;stroke-width:2}
.base{fill:#dcfce7;stroke:#16a34a;stroke-width:2}
.floor{stroke:#9ca3af;stroke-width:2}
.ret{fill:#b45309}
.div{stroke:#c7d2fe;stroke-width:1}
.code{fill:#f9fafb;stroke:#d1d5db;stroke-width:1}
.hl{fill:#fef3c7}
.arrow{stroke:#d97706;stroke-width:2;fill:none}
.ah{fill:#d97706}
.ahs{fill:none;stroke:#d97706;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.ahs2{fill:none;stroke:#6366f1;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.chev{fill:none;stroke:#9ca3af;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
@media (prefers-color-scheme: dark){
.ahs{stroke:#f59e0b}.ahs2{stroke:#818cf8}.chev{stroke:#6b7280}

.t,.m{fill:#e5e7eb}.mut{fill:#9ca3af}
.f{fill:#1e1b4b;stroke:#818cf8}
.main{fill:#1f2937;stroke:#6b7280}
.act{fill:#451a03;stroke:#f59e0b}
.base{fill:#052e16;stroke:#22c55e}
.floor{stroke:#6b7280}
.ret{fill:#fbbf24}
.div{stroke:#3730a3}
.code{fill:#111827;stroke:#374151}
.hl{fill:#451a03}
.arrow{stroke:#f59e0b}.ah{fill:#f59e0b}
}
</style>
<text x="40" y="34" font-size="18" font-weight="600" class="t">Tail-recursive factorial(3)</text>
<text x="40" y="58" font-size="12" class="m mut">factorial(n, acc): if n == 0, return acc; otherwise return factorial(n - 1, n * acc)</text>
<text x="40" y="104" font-size="15" font-weight="600" class="t">Without tail call optimization</text>
<line x1="40" y1="372" x2="860" y2="372" class="div"/>
<text x="40" y="404" font-size="15" font-weight="600" class="t">With tail call optimization</text>
<rect x="40" y="286" width="140" height="32" rx="5" class="main"/>
<text x="110.0" y="307" text-anchor="middle" font-size="13" class="m">main()</text>
<rect x="40" y="248" width="140" height="32" rx="5" class="act"/>
<text x="110.0" y="269" text-anchor="middle" font-size="13" class="m">factorial(3, 1)</text>
<line x1="36" y1="322" x2="184" y2="322" class="floor"/>
<text x="110.0" y="344" text-anchor="middle" font-size="12" class="t mut">2 frames</text>
<path d="M192,296.0 L198,302.0 L192,308.0" class="chev"/>
<rect x="210" y="286" width="140" height="32" rx="5" class="main"/>
<text x="280.0" y="307" text-anchor="middle" font-size="13" class="m">main()</text>
<rect x="210" y="248" width="140" height="32" rx="5" class="f"/>
<text x="280.0" y="269" text-anchor="middle" font-size="13" class="m">factorial(3, 1)</text>
<rect x="210" y="210" width="140" height="32" rx="5" class="act"/>
<text x="280.0" y="231" text-anchor="middle" font-size="13" class="m">factorial(2, 3)</text>
<line x1="206" y1="322" x2="354" y2="322" class="floor"/>
<text x="280.0" y="344" text-anchor="middle" font-size="12" class="t mut">3 frames</text>
<path d="M362,296.0 L368,302.0 L362,308.0" class="chev"/>
<rect x="380" y="286" width="140" height="32" rx="5" class="main"/>
<text x="450.0" y="307" text-anchor="middle" font-size="13" class="m">main()</text>
<rect x="380" y="248" width="140" height="32" rx="5" class="f"/>
<text x="450.0" y="269" text-anchor="middle" font-size="13" class="m">factorial(3, 1)</text>
<rect x="380" y="210" width="140" height="32" rx="5" class="f"/>
<text x="450.0" y="231" text-anchor="middle" font-size="13" class="m">factorial(2, 3)</text>
<rect x="380" y="172" width="140" height="32" rx="5" class="act"/>
<text x="450.0" y="193" text-anchor="middle" font-size="13" class="m">factorial(1, 6)</text>
<line x1="376" y1="322" x2="524" y2="322" class="floor"/>
<text x="450.0" y="344" text-anchor="middle" font-size="12" class="t mut">4 frames</text>
<path d="M532,296.0 L538,302.0 L532,308.0" class="chev"/>
<rect x="550" y="286" width="140" height="32" rx="5" class="main"/>
<text x="620.0" y="307" text-anchor="middle" font-size="13" class="m">main()</text>
<rect x="550" y="248" width="140" height="32" rx="5" class="f"/>
<text x="620.0" y="269" text-anchor="middle" font-size="13" class="m">factorial(3, 1)</text>
<rect x="550" y="210" width="140" height="32" rx="5" class="f"/>
<text x="620.0" y="231" text-anchor="middle" font-size="13" class="m">factorial(2, 3)</text>
<rect x="550" y="172" width="140" height="32" rx="5" class="f"/>
<text x="620.0" y="193" text-anchor="middle" font-size="13" class="m">factorial(1, 6)</text>
<rect x="550" y="134" width="140" height="32" rx="5" class="base"/>
<text x="620.0" y="155" text-anchor="middle" font-size="13" class="m">factorial(0, 6)</text>
<line x1="546" y1="322" x2="694" y2="322" class="floor"/>
<text x="620.0" y="344" text-anchor="middle" font-size="12" class="t mut">5 frames</text>
<path d="M702,296.0 L708,302.0 L702,308.0" class="chev"/>
<rect x="720" y="286" width="140" height="32" rx="5" class="act"/>
<text x="790.0" y="307" text-anchor="middle" font-size="13" class="m">main()</text>
<text x="790.0" y="277" text-anchor="middle" font-size="12" font-weight="600" class="m ret">receives 6</text>
<line x1="716" y1="322" x2="864" y2="322" class="floor"/>
<text x="790.0" y="344" text-anchor="middle" font-size="12" class="t mut">after 4 returns</text>
<rect x="40" y="470" width="140" height="32" rx="5" class="main"/>
<text x="110.0" y="491" text-anchor="middle" font-size="13" class="m">main()</text>
<rect x="40" y="432" width="140" height="32" rx="5" class="act"/>
<text x="110.0" y="453" text-anchor="middle" font-size="13" class="m">factorial(3, 1)</text>
<line x1="36" y1="506" x2="184" y2="506" class="floor"/>
<text x="110.0" y="528" text-anchor="middle" font-size="12" class="t mut">2 frames</text>
<path d="M192,480.0 L198,486.0 L192,492.0" class="chev"/>
<rect x="210" y="470" width="140" height="32" rx="5" class="main"/>
<text x="280.0" y="491" text-anchor="middle" font-size="13" class="m">main()</text>
<rect x="210" y="432" width="140" height="32" rx="5" class="act"/>
<text x="280.0" y="453" text-anchor="middle" font-size="13" class="m">factorial(2, 3)</text>
<text x="280.0" y="424" text-anchor="middle" font-size="11" class="t mut">frame reused</text>
<line x1="206" y1="506" x2="354" y2="506" class="floor"/>
<text x="280.0" y="528" text-anchor="middle" font-size="12" class="t mut">2 frames</text>
<path d="M362,480.0 L368,486.0 L362,492.0" class="chev"/>
<rect x="380" y="470" width="140" height="32" rx="5" class="main"/>
<text x="450.0" y="491" text-anchor="middle" font-size="13" class="m">main()</text>
<rect x="380" y="432" width="140" height="32" rx="5" class="act"/>
<text x="450.0" y="453" text-anchor="middle" font-size="13" class="m">factorial(1, 6)</text>
<text x="450.0" y="424" text-anchor="middle" font-size="11" class="t mut">frame reused</text>
<line x1="376" y1="506" x2="524" y2="506" class="floor"/>
<text x="450.0" y="528" text-anchor="middle" font-size="12" class="t mut">2 frames</text>
<path d="M532,480.0 L538,486.0 L532,492.0" class="chev"/>
<rect x="550" y="470" width="140" height="32" rx="5" class="main"/>
<text x="620.0" y="491" text-anchor="middle" font-size="13" class="m">main()</text>
<rect x="550" y="432" width="140" height="32" rx="5" class="base"/>
<text x="620.0" y="453" text-anchor="middle" font-size="13" class="m">factorial(0, 6)</text>
<text x="620.0" y="424" text-anchor="middle" font-size="11" class="t mut">frame reused</text>
<line x1="546" y1="506" x2="694" y2="506" class="floor"/>
<text x="620.0" y="528" text-anchor="middle" font-size="12" class="t mut">2 frames</text>
<path d="M702,480.0 L708,486.0 L702,492.0" class="chev"/>
<rect x="720" y="470" width="140" height="32" rx="5" class="act"/>
<text x="790.0" y="491" text-anchor="middle" font-size="13" class="m">main()</text>
<text x="790.0" y="461" text-anchor="middle" font-size="12" font-weight="600" class="m ret">receives 6</text>
<line x1="716" y1="506" x2="864" y2="506" class="floor"/>
<text x="790.0" y="528" text-anchor="middle" font-size="12" class="t mut">after 1 return</text>
<rect x="40" y="571" width="12" height="12" rx="2" class="act"/><text x="58" y="582" font-size="12" class="t mut">active frame</text><rect x="164" y="571" width="12" height="12" rx="2" class="base"/><text x="182" y="582" font-size="12" class="t mut">base case</text><rect x="267" y="571" width="12" height="12" rx="2" class="f"/><text x="285" y="582" font-size="12" class="t mut">waiting for a call to return</text>
</svg>