<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340" width="720" height="340" role="img" aria-labelledby="title desc" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title id="title">Anatomy of a stack frame</title>
<desc id="desc">The top stack frame for factorial(2) holds its parameter n = 2, its local variable sub, and a return address pointing to line 3 of factorial(3), where execution resumes when factorial(2) returns.</desc>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs>
<style>
.t{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;fill:#1f2937}
.m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#1f2937}
.mut{fill:#6b7280}
.f{fill:#eef2ff;stroke:#6366f1;stroke-width:1.5}
.main{fill:#f3f4f6;stroke:#9ca3af;stroke-width:1.5}
.act{fill:#fef3c7;stroke:#d97706;stroke-width:2}
.base{fill:#dcfce7;stroke:#16a34a;stroke-width:2}
.floor{stroke:#9ca3af;stroke-width:2}
.ret{fill:#b45309}
.div{stroke:#c7d2fe;stroke-width:1}
.code{fill:#f9fafb;stroke:#d1d5db;stroke-width:1}
.hl{fill:#fef3c7}
.arrow{stroke:#d97706;stroke-width:2;fill:none}
.ah{fill:#d97706}
@media (prefers-color-scheme: dark){
.t,.m{fill:#e5e7eb}.mut{fill:#9ca3af}
.f{fill:#1e1b4b;stroke:#818cf8}
.main{fill:#1f2937;stroke:#6b7280}
.act{fill:#451a03;stroke:#f59e0b}
.base{fill:#052e16;stroke:#22c55e}
.floor{stroke:#6b7280}
.ret{fill:#fbbf24}
.div{stroke:#3730a3}
.code{fill:#111827;stroke:#374151}
.hl{fill:#451a03}
.arrow{stroke:#f59e0b}.ah{fill:#f59e0b}
}
</style>
<text x="30" y="34" font-size="18" font-weight="600" class="t">Anatomy of a stack frame</text>
<rect x="30" y="56" width="330" height="168" rx="6" class="act"/>
<text x="48" y="82" font-size="15" font-weight="700" class="m">factorial(2)</text>
<text x="344" y="82" text-anchor="end" font-size="12" class="t mut">top of stack</text>
<line x1="44" y1="94" x2="346" y2="94" class="div"/>
<text x="48" y="122" font-size="12" class="t mut">Parameters</text>
<text x="180" y="122" font-size="13" class="m">n = 2</text>
<line x1="44" y1="138" x2="346" y2="138" class="div"/>
<text x="48" y="164" font-size="12" class="t mut">Local variables</text>
<text x="180" y="164" font-size="13" class="m">sub = (unassigned)</text>
<line x1="44" y1="180" x2="346" y2="180" class="div"/>
<text x="48" y="206" font-size="12" class="t mut">Return address</text>
<text x="180" y="206" font-size="13" class="m">factorial(3), line 3</text>
<rect x="30" y="232" width="330" height="40" rx="6" class="f"/>
<text x="195" y="257" text-anchor="middle" font-size="14" class="m">factorial(3)</text>
<rect x="30" y="278" width="330" height="40" rx="6" class="main"/>
<text x="195" y="303" text-anchor="middle" font-size="14" class="m">main()</text>
<line x1="25" y1="324" x2="365" y2="324" class="floor"/>
<rect x="440" y="56" width="260" height="116" rx="6" class="code"/>
<rect x="446" y="113" width="248" height="24" rx="3" class="hl"/>
<text x="456" y="84" font-size="13" class="m mut">1</text><text x="478" y="84" font-size="13" class="m">def factorial(n):</text>
<text x="456" y="108" font-size="13" class="m mut">2</text><text x="478" y="108" font-size="13" class="m">&#160;&#160;&#160;&#160;if n == 0: return 1</text>
<text x="456" y="130" font-size="13" class="m mut">3</text><text x="478" y="130" font-size="13" class="m">&#160;&#160;&#160;&#160;sub = factorial(n - 1)</text>
<text x="456" y="154" font-size="13" class="m mut">4</text><text x="478" y="154" font-size="13" class="m">&#160;&#160;&#160;&#160;return n * sub</text>
<path d="M366,202 C412,202 398,125 444,125" class="arrow" marker-end="url(#ah)"/>
<text x="440" y="200" font-size="12" class="t mut">When factorial(2) returns,</text>
<text x="440" y="218" font-size="12" class="t mut">factorial(3) resumes at line 3</text>
<text x="440" y="236" font-size="12" class="t mut">and assigns the result to sub.</text>
</svg>