<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" width="900" height="400" role="img" aria-labelledby="title desc" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title id="title">Call stack unwinding: factorial(3)</title><desc id="desc">Five snapshots of the call stack unwinding. Each return pops the top frame and passes its value to the caller, until main receives 6.</desc>
<style>
.t{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;fill:#1f2937}
.m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#1f2937}
.mut{fill:#6b7280}
.f{fill:#eef2ff;stroke:#6366f1;stroke-width:1.5}
.main{fill:#f3f4f6;stroke:#9ca3af;stroke-width:1.5}
.act{fill:#fef3c7;stroke:#d97706;stroke-width:2}
.base{fill:#dcfce7;stroke:#16a34a;stroke-width:2}
.floor{stroke:#9ca3af;stroke-width:2}
.ret{fill:#b45309}
.div{stroke:#c7d2fe;stroke-width:1}
.code{fill:#f9fafb;stroke:#d1d5db;stroke-width:1}
.hl{fill:#fef3c7}
.arrow{stroke:#d97706;stroke-width:2;fill:none}
.ah{fill:#d97706}
@media (prefers-color-scheme: dark){
.t,.m{fill:#e5e7eb}.mut{fill:#9ca3af}
.f{fill:#1e1b4b;stroke:#818cf8}
.main{fill:#1f2937;stroke:#6b7280}
.act{fill:#451a03;stroke:#f59e0b}
.base{fill:#052e16;stroke:#22c55e}
.floor{stroke:#6b7280}
.ret{fill:#fbbf24}
.div{stroke:#3730a3}
.code{fill:#111827;stroke:#374151}
.hl{fill:#451a03}
.arrow{stroke:#f59e0b}.ah{fill:#f59e0b}
}
</style>
<text x="25" y="34" font-size="18" font-weight="600" class="t">Call stack unwinding: factorial(3)</text>
<rect x="25" y="260" width="150" height="40" rx="6" class="main"/>
<text x="100" y="285" text-anchor="middle" font-size="14" class="m">main()</text>
<rect x="25" y="214" width="150" height="40" rx="6" class="f"/>
<text x="100" y="239" text-anchor="middle" font-size="14" class="m">factorial(3)</text>
<rect x="25" y="168" width="150" height="40" rx="6" class="f"/>
<text x="100" y="193" text-anchor="middle" font-size="14" class="m">factorial(2)</text>
<rect x="25" y="122" width="150" height="40" rx="6" class="f"/>
<text x="100" y="147" text-anchor="middle" font-size="14" class="m">factorial(1)</text>
<rect x="25" y="76" width="150" height="40" rx="6" class="base"/>
<text x="100" y="101" text-anchor="middle" font-size="14" class="m">factorial(0)</text>
<text x="100" y="66" text-anchor="middle" font-size="13" font-weight="600" class="m ret">returns 1</text>
<line x1="20" y1="304" x2="180" y2="304" class="floor"/>
<text x="100" y="330" text-anchor="middle" font-size="12" font-weight="600" class="t">Step 6</text>
<text x="100" y="348" text-anchor="middle" font-size="12" class="t mut">factorial(0) returns</text>
<text x="187" y="287" text-anchor="middle" font-size="16" class="t mut">→</text>
<rect x="200" y="260" width="150" height="40" rx="6" class="main"/>
<text x="275" y="285" text-anchor="middle" font-size="14" class="m">main()</text>
<rect x="200" y="214" width="150" height="40" rx="6" class="f"/>
<text x="275" y="239" text-anchor="middle" font-size="14" class="m">factorial(3)</text>
<rect x="200" y="168" width="150" height="40" rx="6" class="f"/>
<text x="275" y="193" text-anchor="middle" font-size="14" class="m">factorial(2)</text>
<rect x="200" y="122" width="150" height="40" rx="6" class="act"/>
<text x="275" y="147" text-anchor="middle" font-size="14" class="m">factorial(1)</text>
<text x="275" y="112" text-anchor="middle" font-size="13" font-weight="600" class="m ret">returns 1 × 1 = 1</text>
<line x1="195" y1="304" x2="355" y2="304" class="floor"/>
<text x="275" y="330" text-anchor="middle" font-size="12" font-weight="600" class="t">Step 7</text>
<text x="275" y="348" text-anchor="middle" font-size="12" class="t mut">factorial(1) returns</text>
<text x="362" y="287" text-anchor="middle" font-size="16" class="t mut">→</text>
<rect x="375" y="260" width="150" height="40" rx="6" class="main"/>
<text x="450" y="285" text-anchor="middle" font-size="14" class="m">main()</text>
<rect x="375" y="214" width="150" height="40" rx="6" class="f"/>
<text x="450" y="239" text-anchor="middle" font-size="14" class="m">factorial(3)</text>
<rect x="375" y="168" width="150" height="40" rx="6" class="act"/>
<text x="450" y="193" text-anchor="middle" font-size="14" class="m">factorial(2)</text>
<text x="450" y="158" text-anchor="middle" font-size="13" font-weight="600" class="m ret">returns 2 × 1 = 2</text>
<line x1="370" y1="304" x2="530" y2="304" class="floor"/>
<text x="450" y="330" text-anchor="middle" font-size="12" font-weight="600" class="t">Step 8</text>
<text x="450" y="348" text-anchor="middle" font-size="12" class="t mut">factorial(2) returns</text>
<text x="537" y="287" text-anchor="middle" font-size="16" class="t mut">→</text>
<rect x="550" y="260" width="150" height="40" rx="6" class="main"/>
<text x="625" y="285" text-anchor="middle" font-size="14" class="m">main()</text>
<rect x="550" y="214" width="150" height="40" rx="6" class="act"/>
<text x="625" y="239" text-anchor="middle" font-size="14" class="m">factorial(3)</text>
<text x="625" y="204" text-anchor="middle" font-size="13" font-weight="600" class="m ret">returns 3 × 2 = 6</text>
<line x1="545" y1="304" x2="705" y2="304" class="floor"/>
<text x="625" y="330" text-anchor="middle" font-size="12" font-weight="600" class="t">Step 9</text>
<text x="625" y="348" text-anchor="middle" font-size="12" class="t mut">factorial(3) returns</text>
<text x="712" y="287" text-anchor="middle" font-size="16" class="t mut">→</text>
<rect x="725" y="260" width="150" height="40" rx="6" class="act"/>
<text x="800" y="285" text-anchor="middle" font-size="14" class="m">main()</text>
<text x="800" y="250" text-anchor="middle" font-size="13" font-weight="600" class="m ret">receives 6</text>
<line x1="720" y1="304" x2="880" y2="304" class="floor"/>
<text x="800" y="330" text-anchor="middle" font-size="12" font-weight="600" class="t">Step 10</text>
<text x="800" y="348" text-anchor="middle" font-size="12" class="t mut">back in main()</text>
<rect x="25" y="368" width="12" height="12" rx="2" class="act"/>
<text x="43" y="379" font-size="12" class="t mut">returning frame</text>
<rect x="170" y="368" width="12" height="12" rx="2" class="base"/>
<text x="188" y="379" font-size="12" class="t mut">base case</text>
<rect x="273" y="368" width="12" height="12" rx="2" class="f"/>
<text x="291" y="379" font-size="12" class="t mut">waiting for a call to return</text>
</svg>