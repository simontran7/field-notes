<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 370" width="820" height="370" role="img" aria-labelledby="title desc" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title id="title">Entering factorial(2)</title>
<desc id="desc">The call on line 3 makes the instruction pointer jump to the first instruction of factorial, line 2. The new factorial(2) frame is now active, so reading n gives 2 from that frame, while the n = 3 in factorial(3)'s frame is untouched.</desc>
<defs>
<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker>
<marker id="ah2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" class="ah2"/></marker>
</defs>
<style>
.t{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;fill:#1f2937}
.m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#1f2937}
.mut{fill:#6b7280}
.f{fill:#eef2ff;stroke:#6366f1;stroke-width:1.5}
.main{fill:#f3f4f6;stroke:#9ca3af;stroke-width:1.5}
.act{fill:#fef3c7;stroke:#d97706;stroke-width:2}
.base{fill:#dcfce7;stroke:#16a34a;stroke-width:2}
.floor{stroke:#9ca3af;stroke-width:2}
.ret{fill:#b45309}
.div{stroke:#c7d2fe;stroke-width:1}
.code{fill:#f9fafb;stroke:#d1d5db;stroke-width:1}
.hl{fill:#fef3c7}
.arrow{stroke:#d97706;stroke-width:2;fill:none}
.ah{fill:#d97706}
.arrow2{stroke:#6366f1;stroke-width:2;fill:none}
.ah2{fill:#6366f1}
.call{fill:none;stroke:#6366f1;stroke-width:1.5;stroke-dasharray:4 3}
.ip{fill:#d97706}
@media (prefers-color-scheme: dark){
.t,.m{fill:#e5e7eb}.mut{fill:#9ca3af}
.f{fill:#1e1b4b;stroke:#818cf8}
.main{fill:#1f2937;stroke:#6b7280}
.act{fill:#451a03;stroke:#f59e0b}
.base{fill:#052e16;stroke:#22c55e}
.floor{stroke:#6b7280}
.ret{fill:#fbbf24}
.div{stroke:#3730a3}
.code{fill:#111827;stroke:#374151}
.hl{fill:#451a03}
.arrow{stroke:#f59e0b}.ah{fill:#f59e0b}
.arrow2{stroke:#818cf8}.ah2{fill:#818cf8}.call{stroke:#818cf8}.ip{fill:#f59e0b}
}
</style>
<text x="30" y="34" font-size="18" font-weight="600" class="t">Entering factorial(2)</text>

<rect x="30" y="60" width="360" height="130" rx="6" class="code"/>
<rect x="36" y="99" width="348" height="24" rx="3" class="hl"/>
<rect x="36" y="125" width="348" height="24" rx="3" class="call"/>
<text x="42" y="117" font-size="13" class="m ip">&#9654;</text>
<text x="62" y="90" font-size="13" class="m mut">1</text><text x="84" y="90" font-size="13" class="m">def factorial(n):</text>
<text x="62" y="116" font-size="13" class="m mut">2</text><text x="84" y="116" font-size="13" class="m">&#160;&#160;&#160;&#160;if n == 0: return 1</text>
<text x="62" y="142" font-size="13" class="m mut">3</text><text x="84" y="142" font-size="13" class="m">&#160;&#160;&#160;&#160;sub = factorial(n - 1)</text>
<text x="62" y="168" font-size="13" class="m mut">4</text><text x="84" y="168" font-size="13" class="m">&#160;&#160;&#160;&#160;return n * sub</text>
<path d="M300,137 C352,137 352,111 268,111" class="arrow2" marker-end="url(#ah2)"/>

<text x="30" y="220" font-size="12" class="t mut"><tspan class="ip">&#9654;</tspan> Instruction pointer. The call on line 3 (dashed)</text>
<text x="30" y="238" font-size="12" class="t mut">makes it jump to the first instruction, line 2.</text>
<text x="30" y="272" font-size="12" class="t mut">While factorial(2) runs, every read or write of n and</text>
<text x="30" y="290" font-size="12" class="t mut">sub uses the copies in the active frame. The copies in</text>
<text x="30" y="308" font-size="12" class="t mut">factorial(3)'s frame stay untouched until it resumes.</text>

<path d="M386,111 C428,111 434,120 470,120" class="arrow" marker-end="url(#ah)"/>
<text x="412" y="100" font-size="12" font-weight="600" class="m ret">reads n</text>

<rect x="474" y="60" width="316" height="120" rx="6" class="act"/>
<text x="492" y="84" font-size="15" font-weight="700" class="m">factorial(2)</text>
<text x="774" y="84" text-anchor="end" font-size="12" class="t mut">active frame</text>
<line x1="488" y1="96" x2="776" y2="96" class="div"/>
<text x="492" y="125" font-size="12" class="t mut">Parameter</text>
<text x="610" y="125" font-size="13" class="m">n = 2</text>
<line x1="488" y1="140" x2="776" y2="140" class="div"/>
<text x="492" y="164" font-size="12" class="t mut">Local variable</text>
<text x="610" y="164" font-size="13" class="m">sub = (unassigned)</text>

<rect x="474" y="188" width="316" height="112" rx="6" class="f"/>
<text x="492" y="212" font-size="15" font-weight="700" class="m">factorial(3)</text>
<text x="774" y="212" text-anchor="end" font-size="12" class="t mut">inactive, untouched</text>
<line x1="488" y1="224" x2="776" y2="224" class="div"/>
<text x="492" y="252" font-size="12" class="t mut">Parameter</text>
<text x="610" y="252" font-size="13" class="m">n = 3</text>
<line x1="488" y1="266" x2="776" y2="266" class="div"/>
<text x="492" y="290" font-size="12" class="t mut">Local variable</text>
<text x="610" y="290" font-size="13" class="m">sub = (unassigned)</text>

<rect x="474" y="308" width="316" height="36" rx="6" class="main"/>
<text x="632" y="331" text-anchor="middle" font-size="14" class="m">main()</text>
<line x1="469" y1="350" x2="795" y2="350" class="floor"/>
</svg>