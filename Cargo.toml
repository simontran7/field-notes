[package]
name = "cs-handbook"
version = "0.1.0"
edition = "2024"

[dependencies]
comrak = "0.54"
serde_json = "1"
lumis = { version = "=0.15.0", default-features = false, features = ["lang-rust", "lang-c", "lang-python", "lang-bash", "lang-asm"] }
regex = "1"
notify = "6"
katex-rs = "0.3"
axum = { version = "0.8", default-features = false, features = ["http1", "tokio"] }
tokio = { version = "1", features = ["rt", "net"] }
tower-http = { version = "0.7", features = ["fs"] }
tower-livereload = "0.10"
